<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>барабанная: ассеты</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=JetBrains+Mono:wght@400&family=Unbounded:wght@500&family=Comfortaa:wght@500&family=PT+Serif:wght@400&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff00d0;--yellow:#ffe100;--ink:#141414;--mut:#6b6964;--line:#ebe9e4;--bg:#f3f2ef}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 Ubuntu,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
aside{position:fixed;left:0;top:0;bottom:0;width:270px;overflow-y:auto;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);padding:20px 18px 24px;z-index:5}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand a{font-size:13px;color:var(--mut);text-decoration:none}
.brand a:hover{color:var(--ink)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px}
.tabs button{border:0;background:#f4f2ef;border-radius:10px;padding:10px;font-weight:500;text-align:left}
.tabs button.on{background:var(--yellow)}
.sec{padding:12px 0 2px}
.lab{font-size:11px;color:var(--mut);margin-bottom:6px;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:5px 11px;white-space:pre;text-align:left}
.chips button.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.chips.dir button{width:36px;padding:5px 0;text-align:center}
input[type=range]{width:100%;accent-color:var(--pink);margin:2px 0 0}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer;padding:3px 0}
.chk input{accent-color:var(--pink);margin:0}
.add{width:100%;border:1.5px dashed #d6d3cb;background:#faf9f6;border-radius:10px;padding:9px;color:var(--mut)}
.add:hover{border-color:var(--pink);color:var(--pink)}
.foot{display:grid;gap:6px;margin-top:auto;position:sticky;bottom:0;background:#fff;padding:14px 0 2px}
.big{background:var(--pink);color:#fff;border:0;border-radius:12px;padding:11px;font-weight:500}
.alt{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px}
.note{font-size:12px;color:var(--mut);margin-top:6px}
main{position:fixed;left:270px;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:40px;padding:40px}
.stage{position:relative;flex:none;outline:1px solid var(--line)}
.stage canvas{display:block;cursor:crosshair}
.stage.round{outline:0}
/* the avatar is a square file; the circle is only how instagram shows it: corners stay visible, dimmed */
.amask{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle closest-side,transparent 99.4%,rgba(243,242,239,.82) 100%)}
.stage:not(.round) .amask,.stage:not(.round) .adir{display:none}
/* handle direction: a dot just outside the circle, drag it around */
.adir{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid var(--ink);background:var(--yellow);padding:0;cursor:grab;touch-action:none}
.adir:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.side{display:flex;flex-direction:column;gap:22px;align-items:center}
.side figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.side canvas{border-radius:50%;outline:1px solid var(--line)}
.side.strip{max-height:calc(100vh - 80px);overflow-y:auto;gap:10px;padding:4px}
.th{width:96px;height:120px;border-radius:8px;background:#ddd center/cover;position:relative;cursor:pointer;flex:none;outline:2px solid transparent;outline-offset:2px}
.th.on{outline-color:var(--ink)}
.th b{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;line-height:20px;text-align:center}
.plus{width:96px;height:120px;flex:none;border:2px dashed #cfcbc3;border-radius:8px;background:transparent;font-size:34px;color:#b5b1a8;font-weight:300}
.plus:hover{border-color:var(--pink);color:var(--pink)}
.row{position:fixed;left:270px;right:0;top:0;bottom:0;display:none;align-items:flex-start;gap:48px;padding:40px 40px 30px;overflow:auto}
.card{flex:none;display:flex;flex-direction:column;gap:12px}
.card canvas{display:block;outline:1px solid var(--line);touch-action:none}
.card .plus{border:1.5px solid #cfcbc3;border-radius:2px;background:#fff;font-size:30px;font-weight:300;color:var(--ink)}
.card .plus span{display:block;font-size:14px;font-weight:400;color:var(--mut);margin-top:6px}
.card .plus:hover{border-color:var(--pink);color:var(--pink)}
.pic{position:relative}
.del{position:absolute;top:-10px;right:-10px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:15px;line-height:26px;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.del:hover{background:var(--pink)}
.ctl{display:flex;flex-direction:column;gap:8px}
.grp{display:flex;flex-direction:column;gap:6px}
.ctl{gap:20px!important}
.gl{font-size:11px;color:var(--mut)}
.compass{display:grid;grid-template-columns:repeat(3,28px);grid-template-rows:repeat(3,28px);gap:3px;flex:none}
.compass button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:0;font-size:13px;line-height:1}
.compass button.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.compass i{display:block}
.sl{display:flex;flex-direction:column;gap:3px;flex:1;min-width:120px;font-size:12px;color:var(--mut)}
.sl input{width:100%}
.col{display:flex;flex-direction:column;gap:6px;flex:1}
.posrow{align-items:flex-start!important}
.sub{display:flex;flex-direction:column;gap:8px;padding-left:12px;border-left:2px solid var(--line)}
.tg{align-self:flex-start;border:1px solid var(--line);background:#fff;border-radius:14px;padding:5px 12px}
.tg.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.row .card{margin-top:64px;margin-bottom:96px}
.card.active{z-index:3}
/* instagram phone next to the avatar */
.igcard{align-self:flex-start;margin-top:64px}
/* just the two phones, to the left of the eye */
.igpanel{position:fixed;top:76px;right:24px;z-index:15;opacity:0;transform:translateX(24px);pointer-events:none;transition:opacity .2s,transform .2s}
.igpanel.on{opacity:1;transform:none;pointer-events:auto}.igpanel .igcard{margin:0}
@media (prefers-reduced-motion:reduce){.igpanel{transition:none}}
.igeye{position:fixed;top:20px;right:20px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;z-index:16;place-items:center;padding:0;cursor:pointer}
.igeye svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.8}
.igeye.on{background:var(--yellow);border-color:var(--yellow)}
.ighd.c b{text-align:center;margin:0}.ighd.c span{width:14px}
.igun{font-size:14px;font-weight:600}
.igstory span{max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.igun span{font-weight:400;margin-left:4px}
.igmore{color:#8e8e8e}.iglink{color:#3156d6;margin-top:4px}
.igfb{display:flex;align-items:center;gap:8px;padding:0 16px 10px;font-size:12px;line-height:1.3}.igfa{display:flex;flex:none}.igfa i{width:22px;height:22px;border-radius:50%;background:#ddd;border:2px solid #fff;margin-left:-7px}.igfa i:first-child{margin-left:0}
.igbt span.sq{flex:none;width:30px}
.igstory canvas{width:64px;height:64px;border-radius:50%;box-sizing:border-box;border:2px solid #fff;outline:1px solid #dbdbdb}
.hltitle{position:absolute;left:0;right:0;top:calc(100% + 64px);font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff}
.hltitle.avlabel{border-color:transparent;background:none;color:var(--mut);padding-left:0}
.hltitle:focus{outline:2px solid var(--yellow);border-color:var(--yellow)}
.igwrap{width:calc(390px*var(--igk,.8));height:calc(844px*var(--igk,.8));flex:none}
.igph{width:390px;height:844px;transform:scale(var(--igk,.8));transform-origin:0 0;touch-action:pan-y;cursor:grab;user-select:none;box-sizing:border-box;flex:none;border:12px solid var(--ink);border-radius:56px;background:var(--ink);overflow:hidden;font:13px -apple-system,system-ui,sans-serif;color:#111}
.igtrack{display:flex;width:300%;height:100%;transition:transform .25s}.igtrack.still{transition:none}
.igs{background:#fff;width:33.3333%;flex:none;height:100%;box-sizing:border-box;padding:12px 0 18px;overflow:hidden}
.igst3{background:var(--ink);color:#fff;padding-bottom:0}
.igmedia{position:relative;border-radius:10px;overflow:hidden;color:#fff}.igmedia.light{color:var(--ink)}.igmedia canvas{display:block}.igmedia>canvas{width:100%}
.igbar{position:absolute;left:10px;right:10px;top:10px;height:2px;border-radius:2px;background:color-mix(in srgb,currentColor 35%,transparent)}.igbar i{display:block;height:100%;border-radius:2px;background:currentColor}
.igwho{position:absolute;left:12px;right:12px;top:22px;display:flex;align-items:center;gap:8px;font-size:13px}.igwho span{opacity:.75}.igwho .igx{margin-left:auto;font-size:26px;line-height:1;opacity:1}
.igreply{display:flex;align-items:center;gap:16px;padding:14px 16px;font-size:20px}.igreply span{flex:1;border:1px solid #6b6964;border-radius:22px;padding:10px 16px;font-size:13px}.igreply i{font-style:normal}
.igdotsnav{display:flex;justify-content:center;gap:4px;margin-top:10px}.igdotsnav button{border:0;background:none;border-radius:10px;padding:6px 12px;font:inherit;color:var(--mut)}.igdotsnav button.on{background:var(--yellow);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.igtrack{transition:none}}
.igsb{display:flex;justify-content:space-between;padding:0 22px 8px;font-size:13px}
.ighd{display:flex;align-items:center;padding:4px 16px 12px;font-size:18px}.ighd b{flex:1;margin-left:14px;font-size:17px}
.igtop{display:flex;align-items:center;gap:18px;padding:0 16px}
.igav{border-radius:50%;display:block;flex:none}
.igst>b{font-size:14px}.ignums{display:flex;gap:16px;margin-top:6px}.ignums div{display:flex;flex-direction:column;font-size:12px}.ignums b{font-size:16px}
.igbio{padding:10px 16px 10px;line-height:1.4}
.igbt{display:flex;gap:6px;padding:0 16px}.igbt span{flex:1;text-align:center;background:#efefef;border-radius:8px;padding:6px 0;font-weight:600}
.igstories{display:flex;gap:12px;padding:12px 16px;overflow:hidden}.igstory{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}.igstory i{width:54px;height:54px;border-radius:50%;border:1px solid #ddd;background:#f6f6f6}
.igcm{display:flex;gap:10px;padding:8px 14px 0;line-height:1.35}
.igau{display:flex;align-items:center;gap:10px;padding:0 14px 10px}.igau b{flex:1}.igdots{font-size:16px}
.igpost{display:block;width:100%}
.igtabs{display:flex;margin-top:6px}.igtabs i{flex:1;display:grid;place-items:center;height:34px;border-bottom:1px solid #efefef}.igtabs i.on{border-bottom:2px solid #111}
.igtabs svg{width:18px;height:18px;fill:#111}.igtabs svg.ol{fill:none;stroke:#8e8e8e;stroke-width:1.8}.igtabs svg.ol path{fill:none}
.iggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.iggrid canvas{width:100%;aspect-ratio:4/5;display:block}
.igacts{padding:8px 14px 2px;font-size:18px;letter-spacing:2px}
.igcap{padding:0 14px 4px;font-size:11.5px;line-height:1.35}.igcap>div{margin-top:2px}

.iggray{width:28px;height:28px;border-radius:50%;background:#e4e4e4;flex:none}.igmeta{color:#8e8e8e;font-size:11px;margin-top:3px}
.lock{position:absolute;top:-48px;right:-42px;   /* in the gap, on the level of the top buttons: the side tools never cover it */width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;padding:0;z-index:4;display:grid;place-items:center}
.lock svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.lock.on{background:var(--yellow);border-color:var(--yellow)}
.lock:hover{border-color:var(--ink)}   /* neighbours stay put, the tools overlap them */
.row{padding-left:150px}   /* room for the first post's tools */
/* one menu on top, both editors on one page */
aside,main{display:none!important}
.topbar{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;gap:28px;padding:0 24px;background:#fff;z-index:20}
.tblogo canvas{display:block}.tbl,.tbnav a{color:var(--ink);text-decoration:none;padding:7px 12px;border-radius:10px}
.tbl:hover,.tbnav a:hover{background:#f4f2ef}
.tbnav{display:flex;gap:4px;margin-left:auto}.tbnav a.on{background:var(--yellow)}
.tbeye{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:22px;padding:6px 14px 6px 10px;font:inherit;cursor:pointer}
.tbeye svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.8}.tbeye.on{background:var(--yellow);border-color:var(--yellow)}
.page{padding-top:60px;padding-bottom:40vh}   /* room to scroll the last row up to the middle of the screen */
.sec{scroll-margin-top:60px}
.sechd{display:flex;align-items:center;gap:10px;padding:28px calc(40px + var(--pv,0px)) 0 150px;min-height:36px}
.sechd .sp{flex:1}
.page .row{position:static;display:flex;overflow-x:auto;overflow-y:hidden;padding-top:0;padding-right:calc(40px + var(--pv,0px));padding-bottom:10px}
.card.static{cursor:pointer}.card.static canvas{outline:1px solid var(--line)}
.dtop{position:absolute;left:0;right:0;bottom:calc(100% + 12px);display:flex;justify-content:space-between;align-items:center}
.tline{position:absolute;left:0;right:0;top:calc(100% + 60px);display:flex;align-items:center;gap:8px}
.tline .circ{flex:none;display:grid;place-items:center}
.tline svg{width:16px;height:16px;fill:var(--ink);stroke:var(--ink)}
.tdw{display:flex;align-items:center;gap:4px;flex:none;font-size:13px;color:var(--mut)}
.tdur{width:52px;height:36px;border:1px solid var(--line);border-radius:18px;text-align:center;font:inherit;font-size:13px;color:var(--ink);background:#fff;padding:0 4px}
.tdur:focus{outline:2px solid var(--yellow);border-color:var(--yellow)}
.ttrack{position:relative;flex:1;height:36px;cursor:pointer;touch-action:none;margin:0 9px}
.ttrack::before{content:'';position:absolute;left:0;right:0;top:17px;height:2px;background:var(--line)}
.ttick{position:absolute;top:13px;width:1px;height:10px;background:#d8d5cf}
.thead{position:absolute;top:2px;bottom:2px;width:2px;margin-left:-1px;background:var(--pink);pointer-events:none}
.tmark{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid var(--ink);background:#fff;padding:0;cursor:ew-resize;z-index:1}
.tmark.on{background:var(--yellow);border-color:var(--yellow)}
.tmark:focus-visible{outline:2px solid var(--pink)}
.dbot{position:absolute;left:0;right:0;top:calc(100% + 12px);display:flex;justify-content:space-between;align-items:center}
.dgrp{display:flex;gap:8px;align-items:center}
.dleft{position:absolute;right:calc(100% + 14px);display:flex;flex-direction:column;align-items:flex-end;gap:8px;width:100px}
.kico{display:flex;align-items:center;gap:8px}
.klab{font-size:12px;color:var(--mut);text-align:right;white-space:nowrap}
.kico:hover .klab,.kico:focus-within .klab{color:var(--ink)}
.dleft.lab{width:auto}
.dleft .gap{height:6px}
.sws.wrap{justify-content:flex-end}
.dleft select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:4px 6px;background:#fff;width:100px}
.sws.col{flex-direction:column;align-items:flex-end}
.circ{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;padding:0;font-size:14px;line-height:1}
.circ.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.circ.lg{font-size:11px}
.circ.del2{position:absolute;top:-14px;right:-14px;width:28px;height:28px;background:var(--ink);color:#fff;border-color:var(--ink);font-size:13px;z-index:7}
.circ.del2:hover{background:var(--pink);color:#fff;border-color:var(--pink)}
.rect{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px}
.rect:hover{border-color:var(--ink)}
.pic{position:relative}
.ov{position:absolute;inset:0;cursor:pointer}
.kinds{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.kind{border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px;line-height:0}
.kind.on{border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow)}
.snap{position:absolute;border:1.5px dashed rgba(20,20,20,.35);border-radius:4px;pointer-events:none}
.snap.on{border:2px solid var(--yellow);background:rgba(255,225,0,.18)}
.selbox{position:absolute;border:2px dashed var(--yellow);border-radius:4px;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.ontext{position:absolute;margin:0;padding:0;border:0;outline:2px dashed var(--yellow);outline-offset:6px;background:transparent;font-family:Ubuntu;line-height:1.04;resize:none;overflow:hidden;caret-color:var(--pink)}
.card{position:relative}
.tools{position:absolute;left:calc(100% + 16px);width:230px;display:flex;flex-direction:column;gap:12px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;z-index:6}
.trow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb{border:1px solid var(--line);background:#fff;border-radius:12px;padding:5px 11px;min-height:30px}
.tb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;width:100%}
.knob{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:ns-resize;user-select:none;touch-action:none;font-size:11px;color:var(--mut);border-radius:10px;padding:2px}
.knob svg{width:36px;height:36px}
.knob span{display:none}
.knob{padding:0!important}
.knob .kt{fill:#fff;stroke:var(--line);stroke-width:2.5}
.knob .kv{fill:none;stroke:var(--yellow);stroke-width:3;stroke-linecap:round}
.stk{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:grab;touch-action:none;user-select:none}
.stk svg{width:100%;height:100%;display:block}
.stk line{stroke:var(--mut);stroke-width:3;stroke-linecap:round}.stk circle{fill:var(--mut)}
.stk.on{background:var(--yellow);border-color:var(--yellow)}.stk.on line{stroke:var(--ink)}.stk.on circle{fill:var(--ink)}
.stk:focus-visible{outline:2px solid var(--pink)}
.knob .kh{fill:var(--ink)}
.knob .kp{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.knob:focus-visible{outline:2px solid var(--pink)}
.hint2{font-size:12px;color:var(--mut)}
.ctl textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:7px 9px;resize:vertical;background:#fff}
.ctl select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff}
.posrow{display:flex;gap:10px;align-items:center}.posrow input{flex:1}
.acts{display:flex;gap:6px}.acts button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 10px;font-size:13px}
.sws{display:flex;gap:8px}
.sw{width:28px;height:28px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);background-size:cover}
.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--yellow)}
#toast{position:fixed;right:24px;top:76px;transform:translateY(-12px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;transition:opacity .2s,transform .2s;z-index:20}

.hint{position:fixed;right:22px;bottom:18px;font-size:12px;color:var(--mut)}
#drop{position:fixed;inset:72px 12px 12px 12px;border:2px dashed var(--pink);border-radius:18px;display:none;place-items:center;color:var(--pink);font-weight:500;background:rgba(255,0,208,.04);pointer-events:none;z-index:9}

button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
</style>
</head>

<aside>

<script>
'use strict';
// ───────── brand rules (from the guide) ─────────
const RING={size:.6,phase:.23,shift:.061,angle:15,blur:0,soft:1.35,persp:0,sy:1.08,disp:.88,rgb:.35,tint:.43};
const PINK=[1,0,.816],WHITE=[1,1,1],DARK=[20/255,20/255,20/255];
const SURF={ // background decides everything else
  pink:{sw:'#ff00d0',bg:PINK,grad:'yellow',stick:'white'},
  white:{sw:'#ffffff',bg:WHITE,grad:'pink',stick:'pinkyellow'},
  photo:{sw:null,bg:WHITE,grad:'pink',stick:'white'},
};
const DIRS=[['↖',-135],['↑',-90],['↗',-50],['←',180],['→',0],['↙',135],['↓',90],['↘',45]];
const LOGOS=[
  {id:'b1',label:'( ( б ) )',level:1,main:true},{id:'b0',label:'( б )',level:0},{id:'b2',label:'(  ( ( б ) )  )',level:2},{id:'b3',label:'(   (  ( ( б ) )  )   )',level:3},
  {id:'w1',label:'( ( барабанная ) )',level:1,word:'барабанная'},
  {id:'m1',label:'барабанная',lines:['барабанная']},{id:'m2',label:'барабанная / мастерская',lines:['барабанная','мастерская']},
  {id:'m4',label:'барабанная мастерская петра атапина',lines:['барабанная','мастерская','петра','атапина']},
];
const FONTS=[['Ubuntu','Ubuntu',400],['моно','"JetBrains Mono"',400],['антиква','"PT Serif"',400],['гротеск','Unbounded',500],['округлый','Comfortaa',500]];
const LCOL={white:'#ffffff',pink:'#ff00d0',dark:'#141414',two:'two'};   // two = pink + yellow double brackets
const FMTS={photo:'как фото','4:5':'4:5','1:1':'1:1','9:16':'сторис'};
const FMTWH={'4:5':[1080,1350],'1:1':[1080,1080],'9:16':[1080,1920]};
const POS=[['bl','↙'],['tl','↖'],['tr','↗'],['br','↘'],['c','•']];
const POSNAME={bl:'слева внизу',tl:'слева вверху',tr:'справа вверху',br:'справа внизу',c:'по центру'};   // from bottom-left, clockwise

const DEF={tab:'post',postFmt:'4:5',
  post:{surf:'white',text:'приходи на мастер-класс\nсделаем бубен своими руками',tsize:.5,tpos:'top',rings:true,stick:true,logo:true,cx:.64,cy:.62,zone:null,rsize:.45,dir:-50,lkind:'b1',lcolor:'auto',lpos:'bl',lsize:.4},
  avatar:{surf:'pink',cx:.46,cy:.52,phase:.23,stick:true,dir:-50,scale:.55},
  logo:{fmt:'4:5'},
  card:{kind:'b1',color:'white',pos:'bl',size:.5}};      // defaults for every new photo
let S=JSON.parse(JSON.stringify(DEF));
try{const v=JSON.parse(localStorage.getItem('bb.assets.v6')||'null');if(v&&v.avatar){S.tab=v.tab==='logo'?'post':v.tab;if(v.post)Object.assign(S.post,v.post);if(v.postFmt)S.postFmt=v.postFmt;if(v.avatarSet)S.avatarSet=v.avatarSet;if(v.hlSet)S.hlSet=v.hlSet;if(Array.isArray(v.profile)&&v.profile.length)S.profile=v.profile;if(Array.isArray(v.posts)&&v.posts.length)S.posts=v.posts;Object.assign(S.avatar,v.avatar);Object.assign(S.logo,v.logo||{});Object.assign(S.card,v.card||{})}}catch(e){}
S.move=true;   // a post is always animated; the PNG is the still picture (the end state of a staying wave)
// posts and the profile (avatar + every cover) are kept card by card, so each one comes back with its own settings
let ready=false;
const keepLists=()=>{if(!ready)return;for(const[k,to]of[['post','posts'],['avatar','profile']]){const L=S.tab===k?posts:TABS[k];if(L)S[to]=L.map(p=>({set:p.set,title:p.title,av:p.av,pan:p.pan,pid:p.pid,link:p.link}))}};
// photos live in IndexedDB under the card's photo id
const photoDB=()=>new Promise((ok,no)=>{const r=indexedDB.open('bb.photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function keepPhoto(p,file){p.pid='p'+Date.now()+Math.random().toString(36).slice(2,7);try{const db=await photoDB();db.transaction('p','readwrite').objectStore('p').put(file,p.pid)}catch(e){console.warn(e)}}
async function loadPhoto(p){try{const db=await photoDB(),f=await new Promise(ok=>{const r=db.transaction('p').objectStore('p').get(p.pid);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)});if(!f)return;
  const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{p.img=im;p.url=url;layout()};im.src=url}catch(e){console.warn(e)}}
const restoreList=A=>A.map(o=>{const p={img:null,url:'',pan:o.pan||[0,0],set:o.set,pid:o.pid};if(o.av)p.av=true;if(o.title!=null)p.title=o.title;if(o.link)p.link=true;if(p.pid)loadPhoto(p);return p});
function restoreProfile(){const L=restoreList(S.profile);if(!L.some(isAv))L.unshift(makeAvatarPost());return L}
// on load: forget photos that no card uses any more
async function prunePhotos(){try{const used=new Set([...(S.posts||[]),...(S.profile||[])].map(o=>o.pid)),db=await photoDB(),st=db.transaction('p','readwrite').objectStore('p'),r=st.getAllKeys();r.onsuccess=()=>r.result.forEach(k=>{if(!used.has(k))st.delete(k)})}catch(e){}}
const save=()=>{try{keepLists();localStorage.setItem('bb.assets.v6',JSON.stringify(S))}catch(e){}};

// ───────── engines ─────────
const glc=document.createElement('canvas'),E=Wave.make(glc),stk=document.createElement('canvas'),tmp=document.createElement('canvas');
const photos=[];   // [{img,url,set}]  set = this photo's own logo settings
let avatarPhoto=null;if(S.avatar.surf==='photo')S.avatar.surf='pink';
function addPhotos(srcs){let left=srcs.length;const start=photos.length;
  srcs.forEach((src,i)=>{const im=new Image();im.onload=()=>{const set=JSON.parse(JSON.stringify(S.card));if(!['tl','tr','c','bl','br'].includes(set.pos))set.pos='bl';photos[start+i]={img:im,url:src,set,pan:[0,0]};
    if(!avatarPhoto)avatarPhoto=im;if(--left===0){build();layout()}};im.src=src})}

// ───────── AVATAR ─────────
function renderAvatar(W){
  const A=S.avatar,su=SURF[A.surf],c=document.createElement('canvas');c.width=c.height=W;const x=c.getContext('2d');
  // logo variant: ( ( б ) ) in the middle of the circle, on the plain background or the photo
  if(A.kind==='logo'){const ph=A.surf==='photo'&&avatarPhoto;
    if(ph){const im=avatarPhoto,sc=Math.max(W/im.width,W/im.height);x.drawImage(im,(W-im.width*sc)/2,(W-im.height*sc)/2,im.width*sc,im.height*sc)}
    else{x.fillStyle=A.surf==='white'?'#ffffff':'#ff00d0';x.fillRect(0,0,W,W)}
    const col=A.surf==='white'?'#ff00d0':'#ffffff';let size=W*.3;while(size>8&&Wave.logoWidth(x,size,1,false,'Ubuntu',400,'б')>W*(.42+A.scale*.3))size*=.97;
    Wave.logo(x,W/2,W/2,size,col,null,1,'Ubuntu',400,'б');return c}
  glc.width=glc.height=W;const ph=A.surf==='photo'&&avatarPhoto;E.setImage(ph?avatarPhoto:null);
  const k=.7+A.scale*1.5;  // 0..1 slider -> 0.7..2.2x
  E.draw(Object.assign({},RING,{size:RING.size*k,cx:A.cx,cy:A.cy,phase:A.phase,bg:su.bg,grad:su.grad,mode:ph?1:0}));
  x.drawImage(glc,0,0);
  if(A.stick){stk.width=stk.height=W;Wave.stick(stk.getContext('2d'),W,W,{on:true,cx:A.cx+.03*k,cy:A.cy-.02*k,angle:A.dir,grad:su.stick,blur:.045,scale:k});x.drawImage(stk,0,0)}
  return c;
}
// ───────── LOGO ON PHOTO ─────────
function photoDims(p){const L=S.logo;
  if(L.fmt==='photo'){let s=Math.min(1,2400/Math.max(p.img.width,p.img.height));if(Math.min(p.img.width,p.img.height)*s<1080)s=1080/Math.min(p.img.width,p.img.height);
    return[Math.round(p.img.width*s/2)*2,Math.round(p.img.height*s/2)*2]}
  return FMTWH[L.fmt]||FMTWH['4:5'];}
function fitOf(p,W,H,z=1){const ca=W/H,ia=p.img.width/p.img.height;let sx=1,sy=1;if(ia>ca)sx=ca/ia;else sy=ia/ca;return[sx/z,sy/z]}   // z: photo zoom, 1 = cover
function renderLogo(p,W,H){
  const st=p.set,k=LOGOS.find(l=>l.id===st.kind)||LOGOS[0],f=FONTS[0];
  const two=st.color==='two'&&!k.lines,col=two?'#ff00d0':(LCOL[st.color]==='two'?'#ff00d0':LCOL[st.color]);
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),md=Math.min(W,H);
  const size=md*(k.lines?.035+st.size*.07:.04+st.size*.1),m=md*.06;let box;
  if(k.lines){x.font=`${f[2]} ${size}px ${f[1]}`;let w=0;for(const l of k.lines)w=Math.max(w,x.measureText(l).width);box={w,h:k.lines.length*size*1.02}}
  else box={w:Wave.logoWidth(x,size,k.level,two,f[1],f[2],k.word||'б'),h:size};
  let cx,cy;{
    const lft=m+box.w/2,rgt=W-m-box.w/2,top=m+box.h/2,bot=H-m-box.h/2;[cx,cy]={tl:[lft,top],tr:[rgt,top],bl:[lft,bot],br:[rgt,bot],c:[W/2,H/2]}[st.pos]||[rgt,bot]}
  const pan=p.pan||[0,0];
  {const[sx,sy]=fitOf(p,W,H);x.drawImage(p.img,p.img.width*(1-sx)*(.5+pan[0]),p.img.height*(1-sy)*(.5+pan[1]),p.img.width*sx,p.img.height*sy,0,0,W,H)}
  if(k.lines){x.font=`${f[2]} ${size}px ${f[1]}`;x.fillStyle=col;x.textBaseline='alphabetic';const lh=size*1.02;k.lines.forEach((l,i)=>x.fillText(l,cx-box.w/2,cy-box.h/2+size*.78+i*lh))}
  else Wave.logo(x,cx,cy,size,col,two?'#ffe100':null,k.level,f[1],f[2],k.word||'б');
  return c;
}

// ───────── helpers ─────────
let toastT=0;
function toast(msg,undo){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.innerHTML='';t.append(msg);if(undo){const b=document.createElement('button');b.textContent='отменить';b.onclick=()=>{undo();t.classList.remove('on')};t.appendChild(b)}
  t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),7000)}
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const dpr=()=>Math.min(devicePixelRatio||1,2);
// colour swatch button: shows the colour, never names it
function swatch(val,cur,css,on,title){const b=el('button','sw'+(val===cur?' on':''));b.style.background=css;b.title=title||'';b.setAttribute('aria-label',title||'');b.setAttribute('aria-pressed',val===cur);b.onclick=on;return b}
function swatchRow(p,opts,cur,on){const w=el('div','sws');for(const[v,css,t]of opts)w.appendChild(swatch(v,cur,css,()=>on(v),t));p.appendChild(w)}
// H.264 first (instagram takes it everywhere); VP9 inside MP4 only if the browser has no H.264 encoder
async function pickCodec(w,h){for(const[c,m]of[['avc1.640033','avc'],['avc1.640028','avc'],['avc1.4d0033','avc'],['avc1.42003e','avc'],['avc1.42001f','avc'],['vp09.00.40.08','vp9']]){try{const r=await VideoEncoder.isConfigSupported({codec:c,width:w,height:h,bitrate:8e6,framerate:30});if(r.supported)return[c,m]}catch(e){}}return null}
// one post as a clip: its own length (durOf), 30 fps, H.264 in MP4
async function saveMP4(p,i,W,H,prog){
  if(!('VideoEncoder' in window)){toast('этот браузер не пишет видео — открой в свежем Chrome');return}
  try{const{Muxer,ArrayBufferTarget}=await import('./lib/mp4-muxer.mjs');
    const fps=30,N=Math.round(durOf(p)*fps),pc=await pickCodec(W,H);if(!pc)throw Error('нет видеокодека');const[codec,mc]=pc;
    const muxer=new Muxer({target:new ArrayBufferTarget(),video:{codec:mc,width:W,height:H},fastStart:'in-memory'});let err=null;
    const enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>err=e});enc.configure({codec,width:W,height:H,bitrate:Math.round(W*H*6),framerate:fps});
    for(let f=0;f<N;f++){if(err)throw err;const T=f/fps,fr=renderPost(p,W,H,{t:T});
      const vf=new VideoFrame(fr,{timestamp:Math.round(T*1e6),duration:Math.round(1e6/fps)});enc.encode(vf,{keyFrame:f%fps===0});vf.close();
      while(enc.encodeQueueSize>4)await new Promise(r=>setTimeout(r,1));if(f%3===0){prog&&prog(f/N);await new Promise(r=>setTimeout(r,0))}}
    await enc.flush();if(err)throw err;muxer.finalize();
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([muxer.target.buffer],{type:'video/mp4'}));a.download=`barabannaja-post-${i+1}-${W}x${H}.mp4`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
  catch(e){console.error(e);toast('не получилось записать видео: '+e.message)}}
async function savePNG(img,name){const b=await new Promise(r=>img.toBlob(r,'image/png')),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}

// ───────── avatar stage ─────────
const ROWS={};let row;
const cv=document.getElementById('cv'),stage=document.getElementById('stage'),side=document.getElementById('side'),rowPost=document.getElementById('rowPost'),rowProfile=document.getElementById('rowProfile'),mainEl=document.querySelector('main');
function layoutAvatar(){
  let h=mainEl.clientHeight-80,w=h;const maxW=mainEl.clientWidth-80-160;if(w>maxW){w=maxW;h=w}
  cv.style.width=w+'px';cv.style.height=h+'px';cv.width=cv.height=Math.round(w*dpr());stage.classList.add('round');drawAvatar()}
function placeDir(){const b=document.getElementById('adir'),A=S.avatar,a=(A.dir??-50)*Math.PI/180,r=cv.clientWidth/2,R=r+22;
  b.style.display=A.stick&&A.kind!=='logo'?'block':'none';b.style.left=(r+Math.cos(a)*R)+'px';b.style.top=(r+Math.sin(a)*R)+'px'}
function drawAvatar(){const img=renderAvatar(cv.width),x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);x.drawImage(img,0,0);placeDir();
  side.innerHTML='';for(const[s,l]of[[110,'в профиле'],[40,'в комментариях']]){const f=el('figure'),c=el('canvas'),d=dpr();
    c.width=c.height=s*d;c.style.width=c.style.height=s+'px';c.getContext('2d').drawImage(img,0,0,s*d,s*d);f.append(c,l);side.appendChild(f)}}
let drag=false;
{const b=document.getElementById('adir');let on=false;
  const ang=e=>{const r=cv.getBoundingClientRect();return Math.round(Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI)};
  b.onpointerdown=e=>{on=true;b.setPointerCapture(e.pointerId);e.stopPropagation()};
  b.onpointermove=e=>{if(!on)return;S.avatar.dir=ang(e);drawAvatar()};
  b.onpointerup=()=>{if(on){on=false;save()}};
  b.onkeydown=e=>{const d={ArrowRight:10,ArrowDown:10,ArrowLeft:-10,ArrowUp:-10}[e.key];if(d){e.preventDefault();S.avatar.dir=((S.avatar.dir??-50)+d+540)%360-180;drawAvatar();save()}}}
cv.onpointerdown=e=>{drag=true;cv.setPointerCapture(e.pointerId);cv.onpointermove(e)};
cv.onpointermove=e=>{if(!drag||S.avatar.kind==='logo')return;const r=cv.getBoundingClientRect();S.avatar.cx=(e.clientX-r.left)/r.width;S.avatar.cy=(e.clientY-r.top)/r.height;drawAvatar()};
cv.onpointerup=()=>{drag=false;save()};

// ───────── logo cards row ─────────
let cardH=400;
function layoutRow(){
  cardH=Math.max(220,row.clientHeight-250);
  row.innerHTML='';
  photos.forEach((p,i)=>{if(p)row.appendChild(card(p,i))});
  const[aw,ah]=photos[0]?photoDims(photos[photos.length-1]):[1080,1350];
  const add=el('div','card');const tile=el('button','plus',photos.length?'+':'+<span>добавь фото</span>');tile.style.height=cardH+'px';tile.style.width=Math.round(cardH*aw/ah)+'px';
  tile.onclick=()=>document.getElementById('file').click();add.appendChild(tile);row.appendChild(add);
}
function card(p,i){
  const[W,H]=photoDims(p),w=Math.round(cardH*W/H),c=el('div','card'),cvv=el('canvas');
  cvv.style.width=w+'px';cvv.style.height=cardH+'px';cvv.width=Math.round(w*dpr());cvv.height=Math.round(cardH*dpr());
  const paint=()=>{const img=renderLogo(p,cvv.width,cvv.height);cvv.getContext('2d').drawImage(img,0,0)};paint();
  // drag = move the photo inside the frame (the logo stays where the arrows put it)
  let dr=null;const cl=v=>v<-.5?-.5:v>.5?.5:v;
  cvv.onpointerdown=e=>{dr=[e.clientX,e.clientY];cvv.setPointerCapture(e.pointerId);cvv.style.cursor='grabbing'};
  cvv.onpointermove=e=>{if(!dr)return;const r=cvv.getBoundingClientRect(),[sx,sy]=fitOf(p,W,H),pan=p.pan||(p.pan=[0,0]);
    const dx=(e.clientX-dr[0])/r.width,dy=(e.clientY-dr[1])/r.height;dr=[e.clientX,e.clientY];
    if(1-sx>1e-4)pan[0]=cl(((1-sx)*(.5+pan[0])-dx*sx)/(1-sx)-.5);if(1-sy>1e-4)pan[1]=cl(((1-sy)*(.5+pan[1])-dy*sy)/(1-sy)-.5);paint()};
  cvv.onpointerup=()=>{dr=null;cvv.style.cursor='grab'};cvv.style.cursor='grab';
  const ctl=el('div','ctl');ctl.style.width=Math.max(w,200)+'px';
  const k=LOGOS.find(l=>l.id===p.set.kind)||LOGOS[0];
  const col=[['white','#ffffff','белый'],['pink','#ff00d0','розовый'],['dark','#141414','тёмный']];
  if(!k.lines)col.push(['two','linear-gradient(90deg,#ff00d0 50%,#ffe100 50%)','два цвета']);
  swatchRow(ctl,col,p.set.color,v=>{p.set.color=v;remember(p);refresh()});
  const sel=el('select');for(const l of LOGOS){const o=el('option');o.value=l.id;o.textContent=l.label;if(l.id===p.set.kind)o.selected=true;sel.appendChild(o)}
  sel.onchange=()=>{p.set.kind=sel.value;if(LOGOS.find(l=>l.id===sel.value).lines&&p.set.color==='two')p.set.color='pink';remember(p);refresh()};ctl.appendChild(sel);
  const pr=el('div','posrow'),pc=el('div','chips dir');
  for(const[v,l]of POS){const b=el('button',v===p.set.pos?'on':'',l);b.title=POSNAME[v];b.onclick=()=>{p.set.pos=v;remember(p);refresh()};pc.appendChild(b)}
  const rg=el('input');rg.type='range';rg.min=0;rg.max=1;rg.step=.01;rg.value=p.set.size;rg.title='размер';rg.oninput=()=>{p.set.size=+rg.value;paint()};rg.onchange=()=>remember(p);
  pr.append(pc,rg);ctl.appendChild(pr);
  const ac=el('div','acts');const dl=el('button','','скачать');dl.onclick=()=>{const[W2,H2]=photoDims(p);savePNG(renderLogo(p,W2,H2),`barabannaja-logo-${i+1}-${W2}x${H2}.png`)};
    const all=el('button','','раскатить на все');all.title='цвет, лого, место и размер этого фото — на все остальные';
  all.onclick=()=>{const before=photos.map(q=>q&&JSON.parse(JSON.stringify(q.set)));for(const q of photos)if(q&&q!==p)q.set=JSON.parse(JSON.stringify(p.set));remember(p);refresh();toast('настройки раскатаны на все фото',()=>{photos.forEach((q,k)=>{if(q&&before[k])q.set=before[k]});refresh()})};
  ac.append(dl);if(photos.length>1)ac.append(all);ctl.appendChild(ac);

  document.getElementById('png').style.display=(S.tab==='logo'&&!photos.length)||(isEd()&&!posts.length)?'none':'block';
}
function labelize(){document.querySelectorAll('button[title],input[title],canvas[title]').forEach(e=>{if(!e.getAttribute('aria-label'))e.setAttribute('aria-label',e.title)})}
const DIRNAME={'-135':'влево вверх','-90':'вверх','-50':'вправо вверх','180':'влево','0':'вправо','135':'влево вниз','90':'вниз','45':'вправо вниз'};
function layout(){ROWS.post=rowPost;ROWS.avatar=rowProfile;row=ROWS[S.tab]||rowPost;
  document.getElementById('hint').style.display='none';
  layoutPosts();layoutStatic(S.tab==='post'?'avatar':'post');heads();
  document.querySelectorAll('.tbnav a').forEach(a=>a.classList.toggle('on',a.dataset.k===S.tab));labelize()}
// the section that is not being edited: still pictures; a click opens it in the editor
function layoutStatic(k){const r=ROWS[k];r.innerHTML='';const L=listOf(k),[W,H]=asTab(k,()=>postDims());
  const h=k==='avatar'?Math.min(Math.max(260,Math.min(innerHeight-60-260,560)),440):Math.max(260,Math.min(innerHeight-60-260,560)),w=Math.round(h*W/H);
  L.forEach((p,i)=>{const c=el('div','card static'),pic=el('div','pic'),cv_=el('canvas');cv_.style.width=w+'px';cv_.style.height=h+'px';cv_.width=Math.round(w*dpr());cv_.height=Math.round(h*dpr());
    asTab(k,()=>cv_.getContext('2d').drawImage(renderPost(p,cv_.width,cv_.height),0,0));pic.appendChild(cv_);
    if(k==='avatar'){pic.appendChild(el('div','amask'));pic.appendChild(el('div','hltitle avlabel',isAv(p)?'аватар':p.title||''))}
    c.title='открыть';c.appendChild(pic);c.onclick=()=>{setTab(k);SEL={post:i,el:'bg'};refresh()};r.appendChild(c)})}
// section heads: format and downloads, each next to its own row
function heads(){const hp=document.getElementById('hdpost'),ha=document.getElementById('hdavatar');hp.innerHTML='';ha.innerHTML='';
  const fmt=el('div','chips');for(const[v,l]of[['4:5','4:5'],['1:1','1:1'],['9:16','сторис']]){const b=el('button',v===S.postFmt?'on':'',l);b.onclick=()=>{S.postFmt=v;save();layout()};fmt.appendChild(b)}
  const dl=(k,label,id)=>{const b=el('button','rect',label);b.onclick=()=>{if(S.tab!==k)setTab(k);document.getElementById(id).click()};return b};
  hp.append(fmt,el('i','sp'),dl('post','скачать все png','png'),dl('post','скачать все mp4','pngall'));
  ha.append(el('i','sp'),dl('avatar','скачать все png','png'))}

document.getElementById('rnd').onclick=()=>{const A=S.avatar;A.cx=.36+Math.random()*.26;A.cy=.38+Math.random()*.26;A.phase=Math.random();A.dir=DIRS[(Math.random()*DIRS.length)|0][1];save();build();drawAvatar()};
document.getElementById('pngall').onclick=async()=>{const btn=document.getElementById('pngall'),label=btn.textContent,[W,H]=postDims();btn.disabled=true;
  for(let i=0;i<posts.length;i++)await saveMP4(posts[i],i,W,H,f=>btn.textContent=`пишу ${i+1} из ${posts.length}: ${Math.round(f*100)}%`);
  btn.disabled=false;btn.textContent=label;toast(`скачано видео: ${posts.length}`)};
document.getElementById('png').onclick=async()=>{
  const btn=document.getElementById('png'),label=btn.textContent,list=isEd()?posts:photos;btn.disabled=true;
  for(let i=0;i<list.length;i++){btn.textContent=`скачиваю ${i+1} из ${list.length}`;
    if(isEd()){const[W,H]=postDims().map(v=>v*2),nm=isAv(list[i])?'avatar':isHlP(list[i])?`highlight-${(list[i].title||i+1)}`:`post-${i+1}`;await savePNG(renderPost(list[i],W,H),`barabannaja-${nm}-${W}x${H}.png`)}
    else{const[W,H]=photoDims(list[i]);await savePNG(renderLogo(list[i],W,H),`barabannaja-logo-${i+1}-${W}x${H}.png`)}
    await new Promise(r=>setTimeout(r,400))}
  btn.disabled=false;btn.textContent=label;toast(`скачано: ${list.length}`)};
function takeFiles(list){const fs=[...list].filter(f=>f.type.startsWith('image/'));if(!fs.length)return;
  if(isEd()){const tgt=pendingPost??(S.tab==='avatar'?0:null);pendingPost=null;
    fs.forEach((f,k)=>{const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{if(k===0&&tgt!=null&&posts[tgt]){const o=posts[grpOf(tgt).a];o.img=im;o.url=url;keepPhoto(o,f);gset(tgt,'surf','photo')}
      else if(S.tab==='avatar'){const q=makeHl('новое',posts.length);q.img=im;q.url=url;q.set.surf='photo';keepPhoto(q,f);posts.push(q)}
      else{const q=newPost(im,url);keepPhoto(q,f);posts.push(q)}refresh()};im.src=url});return}
  if(S.tab==='avatar'){avatarPhoto=null;S.avatar.surf='photo';save()}addPhotos(fs.map(f=>URL.createObjectURL(f)));
  if(S.tab==='logo')setTimeout(()=>row.scrollTo({left:row.scrollWidth,behavior:'smooth'}),400)}
document.getElementById('file').onchange=e=>{takeFiles(e.target.files);e.target.value=''};
const drop=document.getElementById('drop');let dc=0;
addEventListener('dragenter',e=>{e.preventDefault();dc++;drop.classList.add('on')});
addEventListener('dragleave',()=>{if(--dc<=0){dc=0;drop.classList.remove('on')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;drop.classList.remove('on');const c=e.target.closest&&e.target.closest('.card[data-i]');if(c&&isEd())pendingPost=+c.dataset.i;takeFiles(e.dataTransfer.files)});
addEventListener('resize',layout);
// click outside the post (or Esc) drops the selection, to look at the post clean
const unselect=()=>{if(!isEd()||SEL.el==null)return;const t=document.activeElement;if(t&&t.classList.contains('ontext'))t.blur();SEL={post:SEL.post,el:null};refresh()};
for(const r of[rowPost,rowProfile])r.addEventListener('pointerdown',e=>{if(r===row&&!e.target.closest('.pic,button,input,select'))unselect()});
addEventListener('keydown',e=>{if(e.code==='Space'&&S.move&&S.tab==='post'&&!e.target.closest('textarea,input,select,button')){e.preventDefault();togglePlay()}});   // space = play / pause
addEventListener('keydown',e=>{if(e.key==='Escape'&&!(document.activeElement&&document.activeElement.classList.contains('ontext')))unselect()});
// saved posts; the first time, the master-class example
posts.push(...newList('post'));
if(location.hash==='#preview')S.eye=true;if(location.hash==='#profile')S.tab='avatar';if(location.hash==='#posts')S.tab='post';
if(S.tab==='avatar'||S.tab==='hl'){S.tab='post';setTab('avatar')}   // reopened on the avatar tab
function brand(){const c=document.getElementById('brand'),d=dpr();c.width=120*d;c.height=24*d;const x=c.getContext('2d');x.scale(d,d);Wave.logo(x,42,12,18,'#ff00d0',null,1)}
function tbLogo(){const c=document.getElementById('tbLogo'),d=dpr();c.width=90*d;c.height=28*d;c.style.width='90px';c.style.height='28px';const x=c.getContext('2d');x.scale(d,d);Wave.logo(x,42,14,20,'#ff00d0',null,1)}
Promise.all(['400 40px Ubuntu','400 40px "JetBrains Mono"','500 40px Unbounded','500 40px Comfortaa','400 40px "PT Serif"'].map(f=>document.fonts.load(f,'(б)'))).catch(()=>{}).then(()=>{brand();tbLogo();build();layout();renderPanel()});
ready=true;prunePhotos();build();layout();
</script>
</body>
</html>
